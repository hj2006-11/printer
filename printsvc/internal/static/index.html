<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CCPC 本地打印服务</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
h1 { font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 10px; }
.status-bar { padding: 8px 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
.status-bar.ok { background: #e6f7e6; color: #2e7d32; }
.status-bar.fail { background: #ffebee; color: #c62828; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { padding: 8px 16px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 4px; }
.tab.active { background: #333; color: #fff; border-color: #333; }
.form-group { margin-bottom: 12px; }
label { display: block; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
textarea { resize: vertical; min-height: 120px; font-family: Consolas, monospace; }
button { padding: 10px 24px; font-size: 14px; background: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #1565c0; }
.result { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-size: 14px; }
.result pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
.hidden { display: none; }
.task-list { margin-top: 24px; }
.task-list h2 { font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 6px; }
.task-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
.task-list th, .task-list td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; word-break: break-all; }
.task-list th { background: #f5f5f5; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #fff; }
.badge.pending { background: #f9a825; }
.badge.completed { background: #2e7d32; }
.badge.failed { background: #c62828; }
.task-list button { margin-top: 8px; padding: 6px 14px; font-size: 12px; background: #757575; }
</style>
</head>
<body>
<h1>CCPC 本地打印服务</h1>
<div id="statusBar" class="status-bar">探活中...</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('ticket')">气球小票</div>
  <div class="tab" onclick="switchTab('code')">代码打印</div>
</div>

<!-- 气球小票表单 -->
<div id="ticketForm">
  <div class="form-group">
    <label>队名</label>
    <input type="text" id="team" placeholder="Team A" value="Team A">
  </div>
  <div class="form-group">
    <label>题号</label>
    <input type="text" id="problem" placeholder="A" value="A">
  </div>
  <div class="form-group">
    <label>通过时间</label>
    <input type="text" id="passTime" placeholder="2026-08-20 10:23:45" value="2026-08-20 10:23:45">
  </div>
  <button onclick="submitTicket()">提交打印</button>
</div>

<!-- 代码打印表单 -->
<div id="codeForm" class="hidden">
  <div class="form-group">
    <label>语言</label>
    <select id="lang">
      <option value="cpp">C++</option>
      <option value="c">C</option>
      <option value="java">Java</option>
      <option value="python">Python</option>
    </select>
  </div>
  <div class="form-group">
    <label>源代码</label>
    <textarea id="source" placeholder="#include <bits/stdc++.h>
using namespace std;
int main() {
    // 你好，世界
    cout << "Hello World" << endl;
    return 0;
}"></textarea>
  </div>
  <button onclick="submitCode()">提交打印</button>
</div>

<div id="result" class="result hidden"></div>

<!-- D7 G5：最近任务列表（前端本地记录 + 轮询，接口仍为契约 v1.0，无新增后端接口） -->
<div class="task-list">
  <h2>最近任务</h2>
  <table id="taskTable">
    <thead>
      <tr><th>任务ID</th><th>类型</th><th>状态</th><th>提交时间</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <button id="clearTasks" onclick="clearTasks()">清空列表</button>
</div>

<script>
// 自动获取服务端口（页面由服务托管，直接用location），接口契约 v1.0
const API_BASE = window.location.origin + '/api/v1';
const LS_KEY = 'ccpc_tasks';

// 页面加载时探活 + 恢复任务列表
window.onload = function() {
  healthCheck();
  setInterval(healthCheck, 3000);
  renderTaskList();
};

function healthCheck() {
  fetch(API_BASE + '/healthz')
    .then(r => r.json())
    .then(data => {
      const bar = document.getElementById('statusBar');
      bar.textContent = '服务在线 (' + API_BASE + ')';
      bar.className = 'status-bar ok';
    })
    .catch(err => {
      const bar = document.getElementById('statusBar');
      bar.textContent = '服务离线 - ' + err.message;
      bar.className = 'status-bar fail';
    });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'ticket') {
    document.getElementById('ticketForm').classList.remove('hidden');
    document.getElementById('codeForm').classList.add('hidden');
  } else {
    document.getElementById('ticketForm').classList.add('hidden');
    document.getElementById('codeForm').classList.remove('hidden');
  }
}

function submitTicket() {
  const payload = {
    type: 'ticket',
    data: {
      team: document.getElementById('team').value,
      problem: document.getElementById('problem').value,
      pass_time: document.getElementById('passTime').value
    }
  };
  doSubmit(payload);
}

function submitCode() {
  const payload = {
    type: 'code',
    data: {
      lang: document.getElementById('lang').value,
      source: document.getElementById('source').value
    }
  };
  doSubmit(payload);
}

// G5：任务列表 —— 读取本地记录，新增任务后持久化，终态保留、非终态轮询
function getStoredTasks() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch (e) { return []; }
}

function storeTask(t) {
  const list = getStoredTasks();
  list.unshift(t); // 最新在前
  localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 20))); // 最多保留20条
}

function renderTaskList() {
  const list = getStoredTasks();
  const tbody = document.querySelector('#taskTable tbody');
  tbody.innerHTML = '';
  list.forEach(t => {
    const tr = document.createElement('tr');
    const idTd = document.createElement('td');
    idTd.textContent = t.task_id || '--';
    const typeTd = document.createElement('td');
    typeTd.textContent = t.type || '--';
    const st = document.createElement('td');
    st.className = 'badge ' + (t.status || 'pending');
    st.textContent = t.status || 'pending';
    const ct = document.createElement('td');
    ct.textContent = t.created_at || '--';
    tr.appendChild(idTd);
    tr.appendChild(typeTd);
    tr.appendChild(st);
    tr.appendChild(ct);
    tbody.appendChild(tr);
  });
}

// 轮询所有非终态任务，更新列表与结果区
// 注意：写回时必须基于最新持久化列表按 task_id 定位更新，不能写回轮询开始时的
// list 快照（轮询期间用户可能已提交新任务/清空列表，写回快照会覆盖丢失新任务，
// 或把已清空的列表又写回——D7 复核发现并修复）。
function pollAll() {
  const list = getStoredTasks();
  list.forEach(t => {
    if (t.status === 'completed' || t.status === 'failed') return;
    fetch(API_BASE + '/tasks/' + t.task_id)
      .then(r => r.json())
      .then(data => {
        const cur = getStoredTasks();
        const i = cur.findIndex(x => x.task_id === t.task_id);
        if (i >= 0) {
          cur[i].status = data.status;
          cur[i].created_at = data.created_at || cur[i].created_at;
          localStorage.setItem(LS_KEY, JSON.stringify(cur));
        }
        renderTaskList();
        if (data.status === 'completed' || data.status === 'failed') {
          showResult('任务终态 [' + t.task_id + ']: ' + JSON.stringify(data, null, 2));
        }
      })
      .catch(() => {}); // 服务短暂离线时静默，探活条会提示
  });
}

function doSubmit(payload) {
  fetch(API_BASE + '/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    showResult('提交成功: ' + JSON.stringify(data, null, 2));
    if (data.task_id) {
      storeTask({ task_id: data.task_id, type: payload.type, status: data.status, created_at: data.created_at });
      renderTaskList();
      pollAll();
    }
  })
  .catch(err => showResult('提交失败: ' + err.message));
}

// 每1.5秒轮询一次所有非终态任务
setInterval(pollAll, 1500);

function clearTasks() {
  localStorage.removeItem(LS_KEY);
  renderTaskList();
}

function showResult(text) {
  const el = document.getElementById('result');
  el.classList.remove('hidden');
  const pre = document.createElement('pre');
  pre.textContent = text; // textContent 而非 innerHTML：任务终态 JSON 可能含用户源代码（<、& 等字符）
  el.textContent = '';
  el.appendChild(pre);
}
</script>
</body>
</html>
